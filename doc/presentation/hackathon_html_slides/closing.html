<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  .slide-container { width: 1280px; min-height: 720px; box-sizing: border-box; background: #F7F9FC; color: #2D3748; font-family: "MS Mincho", "ＭＳ 明朝", serif; display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: -12px; }
  .thanks { margin-top: 112px; color: #805AD5; font-size: 24px; letter-spacing: 7px; }
  .message { margin-top: 76px; font-size: 46px; font-weight: 400; line-height: 1.65; letter-spacing: 5px; }
  .message strong { color: #805AD5; font-weight: 400; }
  .rule { width: 596px; height: 2px; background: #805AD5; margin-top: 44px; }
  .qa { margin-top: 56px; font-size: 29px; line-height: 1.55; letter-spacing: 4px; }
  .note { margin-top: 20px; font-size: 20px; line-height: 1.6; letter-spacing: 1px; color: #4A5568; }
</style>
</head>
<body>
<div class="slide-container">
  <div class="thanks">ご清聴ありがとうございました</div>
  <div class="message">検出を自動化する前に、<br><strong>人の判断を安全にする。</strong></div>
  <div class="rule"></div>
  <div class="qa">質疑応答　3分</div>
  <div class="note">計画主導の最小プロトタイプから、承認と実測の次段階へ。</div>
</div>
</body>
</html>
