<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  .slide-container { width: 1280px; min-height: 720px; box-sizing: border-box; background: #F7F9FC; color: #2D3748; font-family: "MS Mincho", "ＭＳ 明朝", serif; }
  .header { margin-left: 92px; padding-top: 58px; width: 1096px; }
  .header h1 { font-size: 48px; font-weight: 400; letter-spacing: 8px; line-height: 1.35; }
  .header .rule { width: 1096px; height: 2px; background: #805AD5; margin-top: 20px; }
  .content { margin-left: 92px; margin-top: 10px; width: 1096px; display: flex; gap: 70px; }
  .statement { width: 655px; font-size: 38px; line-height: 1.85; letter-spacing: 2px; color: #2D3748; }
  .statement strong { color: #805AD5; font-weight: 400; }
  .facts { width: 330px; border-top: 1px solid #B7A6D9; }
  .fact { border-bottom: 1px solid #D5DCE7; padding-top: 18px; padding-bottom: 18px; }
  .fact .label { color: #805AD5; font-size: 18px; letter-spacing: 3px; }
  .fact .text { margin-top: 8px; font-size: 22px; line-height: 1.65; color: #4A5568; }
  .note { margin-left: 92px; margin-top: 25px; font-size: 21px; line-height: 1.6; color: #4A5568; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="slide-container">
  <div class="header"><h1>候補を「判断できる証拠」へ</h1><div class="rule"></div></div>
  <div class="content">
    <div class="statement">検出だけでは、<br><strong>対応につながらない。</strong><br>人が確認できる根拠へ<br>整理して初めて、<br>次の判断へ進める。</div>
    <div class="facts">
      <div class="fact"><div class="label">[ ROOT ]</div><div class="text">重複・後発類似投稿を候補として整理</div></div>
      <div class="fact"><div class="label">[ EVIDENCE ]</div><div class="text">URL・時刻・本文・判定根拠を同時に提示</div></div>
      <div class="fact"><div class="label">[ BOUNDARY ]</div><div class="text">最終判断は人へ。自動通報・関係断定はしない</div></div>
    </div>
  </div>
  <div class="note">[ PRINCIPLE ] 検出の自動化ではなく、判断可能な状態の再現性を作る。</div>
</div>
</body>
</html>
