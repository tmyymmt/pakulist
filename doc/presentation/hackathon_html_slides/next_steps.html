<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; }
  .slide-container { width: 1280px; min-height: 720px; box-sizing: border-box; background: #F7F9FC; color: #2D3748; font-family: "MS Mincho", "ＭＳ 明朝", serif; text-align: center; }
  .header { margin-left: 84px; padding-top: 48px; width: 1112px; }
  .header h1 { font-size: 46px; font-weight: 400; letter-spacing: 8px; line-height: 1.3; }
  .rule { width: 1112px; height: 2px; background: #805AD5; margin-top: 16px; }
  .thesis { margin-top: 45px; font-size: 34px; line-height: 1.65; letter-spacing: 2px; }
  .thesis strong { color: #805AD5; font-weight: 400; }
  .steps { margin-left: 84px; margin-top: 48px; width: 1112px; display: flex; align-items: center; justify-content: space-between; }
  .step { width: 318px; min-height: 196px; box-sizing: border-box; border-top: 1px solid #B7A6D9; border-bottom: 1px solid #B7A6D9; padding-top: 17px; text-align: left; }
  .index { margin-left: 20px; font-size: 20px; letter-spacing: 4px; color: #805AD5; }
  .name { margin: 15px 20px 0; font-size: 29px; letter-spacing: 2px; line-height: 1.35; }
  .detail { margin: 13px 20px 0; font-size: 20px; line-height: 1.58; color: #4A5568; }
  .arrow { width: 40px; color: #805AD5; font-size: 32px; }
  .footer { margin-top: 46px; font-size: 24px; letter-spacing: 1px; line-height: 1.55; color: #4A5568; }
  .footer strong { color: #2D3748; font-weight: 400; }
</style>
</head>
<body>
<div class="slide-container">
  <div class="header"><h1>次の成功条件は機能数ではない</h1><div class="rule"></div></div>
  <div class="thesis">次の段階は、機能を増やすことではなく、<br><strong>承認と実測を、正しい順序で進めること。</strong></div>
  <div class="steps">
    <div class="step"><div class="index">[ 01 ]</div><div class="name">承認・運用条件</div><div class="detail">正規な外部データ連携を開始できる権限、保持、削除、運用条件を確定する。</div></div>
    <div class="arrow">→</div>
    <div class="step"><div class="index">[ 02 ]</div><div class="name">利用者の実測</div><div class="detail">課題の反復性、価格、利用枠、関係性グラフの価値を利用者検証で確かめる。</div></div>
    <div class="arrow">→</div>
    <div class="step"><div class="index">[ 03 ]</div><div class="name">限定AI評価</div><div class="detail">単価と権限が揃った条件だけで、精度・偽陽性・棄権・原価を評価する。</div></div>
  </div>
  <div class="footer">[ PRINCIPLE ] <strong>便利そうな機能を先取りせず、</strong>安全性・事業性・説明可能性を伴って前進する。</div>
</div>
</body>
</html>
